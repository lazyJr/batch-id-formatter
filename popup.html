<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batch ID Formatter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">ID<span>↗</span></div>
      <div><p class="eyebrow">TEXT UTILITY</p><h1 data-i18n="extensionName">Batch ID Formatter</h1></div>
    </header>
    <p class="intro" data-i18n="intro">Paste IDs. Separators keep each ID intact.</p>
    <div class="field-head"><label for="source" data-i18n="sourceLabel">Input</label><button id="clear" class="text-button" type="button" data-i18n="clear">Clear</button></div>
    <textarea id="source" spellcheck="false" data-i18n-placeholder="sourcePlaceholder" placeholder="e.g. AB123CD456 or comma-separated IDs…"></textarea>
    <div class="length-setting"><label for="number-length" data-i18n="lengthLabel">Digits per ID when numbers run together</label><input id="number-length" type="number" min="1" max="100" data-i18n-placeholder="lengthPlaceholder" placeholder="Leave blank to keep intact"></div>
    <div class="settings"><span data-i18n="quoteLabel">Quotes</span><div class="choices" role="group" aria-label="Quotes" data-i18n-aria="quoteLabel"><button type="button" data-quote="double" aria-pressed="true" data-i18n="doubleQuote">Double</button><button type="button" data-quote="single" aria-pressed="false" data-i18n="singleQuote">Single</button><button type="button" data-quote="none" aria-pressed="false" data-i18n="noQuote">None</button></div></div>
    <div class="field-head"><label for="result" data-i18n="resultLabel">Result</label><span id="count">0 IDs</span></div>
    <textarea id="result" readonly spellcheck="false" data-i18n-placeholder="resultPlaceholder" placeholder="Formatted IDs appear here"></textarea>
    <button id="copy" class="copy" type="button" disabled><span data-i18n="copy">Copy result</span><span>↗</span></button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="formatter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
