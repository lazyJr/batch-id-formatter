<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>编号格式化</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">ID<span>↗</span></div>
      <div><p class="eyebrow">TEXT UTILITY</p><h1>编号格式化</h1></div>
    </header>
    <p class="intro">粘贴任意编号；有分隔符时只按分隔符拆分，避免误切编号。</p>
    <div class="field-head"><label for="source">原始内容</label><button id="clear" class="text-button" type="button">清空</button></div>
    <textarea id="source" spellcheck="false" placeholder="例如 AB123CD456，或一串逗号分隔的编号…"></textarea>
    <div class="length-setting"><label for="number-length">纯数字粘连时，每个编号的位数</label><input id="number-length" type="number" min="1" max="100" placeholder="留空则不拆分"></div>
    <div class="settings"><span>引号格式</span><div class="choices" role="group" aria-label="引号格式"><button type="button" data-quote="double" aria-pressed="true">双引号</button><button type="button" data-quote="single" aria-pressed="false">单引号</button><button type="button" data-quote="none" aria-pressed="false">无引号</button></div></div>
    <div class="field-head"><label for="result">格式化结果</label><span id="count">0 个编号</span></div>
    <textarea id="result" readonly spellcheck="false" placeholder="结果会显示在这里"></textarea>
    <button id="copy" class="copy" type="button" disabled>复制结果 <span>↗</span></button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="formatter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
